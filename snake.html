<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — Haroon Khan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #00060f;
      --accent:      #00f5ff;
      --accent-glow: rgba(0,245,255,0.35);
      --red:         #ff003c;
      --red-glow:    rgba(255,0,60,0.35);
      --gold:        #ffd700;
      --silver:      #c0c8d0;
      --bronze:      #cd7f32;
      --text:        #e8eaf0;
      --muted:       #3a4a5a;
      --muted2:      #6a7a8a;
      --font-mono:   'JetBrains Mono', monospace;
      --font-display:'Rajdhani', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,245,255,0.018) 2px, rgba(0,245,255,0.018) 4px
      );
      pointer-events: none; z-index: 200;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 0% 0%,    rgba(0,245,255,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 60% 60% at 100% 100%, rgba(0,245,255,0.04) 0%, transparent 60%);
      pointer-events: none; z-index: 1;
    }

    .back-link {
      position: fixed; top: 1.2rem; left: 1.5rem;
      font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted2); text-decoration: none;
      border: 1px solid rgba(0,245,255,0.15); padding: 0.4rem 0.9rem;
      transition: all 0.2s; z-index: 201;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

    .game-wrapper {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.9rem;
      position: relative; z-index: 10;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .game-header {
      display: flex; align-items: flex-end;
      justify-content: space-between; width: 100%; padding: 0 2px;
    }
    .game-title {
      font-family: var(--font-display);
      font-size: 2rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text); line-height: 1;
    }
    .game-title .accent {
      color: var(--accent);
      text-shadow: 0 0 18px var(--accent-glow), 0 0 40px rgba(0,245,255,0.15);
    }
    .scores { display: flex; gap: 2rem; align-items: flex-end; }
    .score-box { text-align: right; }
    .score-label {
      display: block; font-size: 0.52rem;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
    }
    .score-val {
      font-size: 1.5rem; font-weight: 700; color: var(--accent);
      text-shadow: 0 0 14px var(--accent-glow); line-height: 1;
    }
    .score-val.red { color: var(--red); text-shadow: 0 0 14px var(--red-glow); }

    /* Leaderboard header button */
    .btn-lb {
      font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.35rem 0.85rem; background: transparent;
      border: 1px solid rgba(0,245,255,0.25); color: var(--muted2);
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-lb:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

    /* ── Canvas ──────────────────────────────────────────────────────────── */
    .canvas-wrap {
      position: relative;
      box-shadow:
        0 0 0 1px rgba(0,245,255,0.2),
        0 0 30px rgba(0,245,255,0.08),
        0 0 80px rgba(0,245,255,0.04);
    }
    canvas { display: block; image-rendering: pixelated; }

    /* ── Canvas overlay (start / game over / name entry) ─────────────────── */
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.85rem;
      background: rgba(0,6,15,0.85);
      backdrop-filter: blur(3px); z-index: 20;
    }
    #overlay.hidden { display: none; }

    .ov-tag {
      font-size: 0.6rem; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--accent);
    }
    .ov-tag.red { color: var(--red); }
    .ov-tag.gold { color: var(--gold); text-shadow: 0 0 14px rgba(255,215,0,0.5); }

    .ov-title {
      font-family: var(--font-display);
      font-size: 3.2rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text); line-height: 1; text-align: center;
    }
    .ov-title .a { color: var(--accent); text-shadow: 0 0 30px var(--accent-glow); }
    .ov-title .r { color: var(--red);    text-shadow: 0 0 30px var(--red-glow); }
    .ov-title .g { color: var(--gold);   text-shadow: 0 0 30px rgba(255,215,0,0.6); }

    .ov-score { font-size: 0.72rem; color: var(--muted2); letter-spacing: 0.12em; }
    .ov-score span { color: var(--accent); }

    .btn-play {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 0.8rem 2.2rem; background: var(--accent); color: #00060f;
      border: none; cursor: pointer;
      box-shadow: 0 0 28px var(--accent-glow); transition: all 0.2s;
    }
    .btn-play:hover { background: #00d4e0; transform: translateY(-2px); box-shadow: 0 4px 40px var(--accent-glow); }
    .btn-play.red { background: var(--red); box-shadow: 0 0 28px var(--red-glow); }
    .btn-play.red:hover { background: #cc0030; box-shadow: 0 4px 40px var(--red-glow); }

    .btn-ghost {
      font-family: var(--font-mono); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.6rem 1.6rem; background: transparent;
      border: 1px solid rgba(0,245,255,0.3); color: var(--muted2);
      cursor: pointer; transition: all 0.2s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* Name entry */
    .name-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.6rem; margin-top: 0.2rem;
    }
    .name-label {
      font-size: 0.58rem; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--muted2);
    }
    .name-row { display: flex; gap: 0.5rem; align-items: center; }
    #nameInput {
      width: 90px; text-align: center;
      font-family: var(--font-mono); font-size: 1.5rem; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      background: rgba(0,245,255,0.06);
      border: 1px solid rgba(0,245,255,0.35); color: var(--accent);
      padding: 0.5rem; outline: none;
      box-shadow: 0 0 16px rgba(0,245,255,0.1);
    }
    #nameInput:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
    #nameInput::placeholder { color: rgba(0,245,255,0.25); }
    #nameSubmit {
      font-family: var(--font-mono); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.6rem 1.2rem; background: var(--accent); color: #00060f;
      border: none; cursor: pointer;
      box-shadow: 0 0 18px var(--accent-glow); transition: all 0.2s;
    }
    #nameSubmit:hover { background: #00d4e0; }

    /* ── Leaderboard modal ───────────────────────────────────────────────── */
    #lbModal {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,6,15,0.92);
      backdrop-filter: blur(6px);
      z-index: 500;
    }
    #lbModal.hidden { display: none; }

    #lbPanel {
      width: min(520px, 92vw);
      border: 1px solid rgba(0,245,255,0.25);
      background: #020c18;
      box-shadow: 0 0 60px rgba(0,245,255,0.1), 0 0 0 1px rgba(0,245,255,0.08);
      padding: 2rem;
      display: flex; flex-direction: column; gap: 1.2rem;
    }

    .lb-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .lb-tag {
      font-size: 0.58rem; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--accent);
    }
    .lb-title {
      font-family: var(--font-display);
      font-size: 2rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text); line-height: 1;
    }
    .lb-title .a { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }

    /* Table */
    .lb-table { width: 100%; border-collapse: collapse; }
    .lb-table thead tr {
      border-bottom: 1px solid rgba(0,245,255,0.12);
    }
    .lb-table th {
      font-size: 0.52rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted);
      padding: 0.4rem 0.5rem; text-align: left; font-weight: 400;
    }
    .lb-table th.r { text-align: right; }
    .lb-table td {
      font-size: 0.78rem; padding: 0.55rem 0.5rem;
      border-bottom: 1px solid rgba(0,245,255,0.05);
      color: var(--muted2);
    }
    .lb-table td.r { text-align: right; }
    .lb-table tr:last-child td { border-bottom: none; }

    /* Rank cell */
    .rank { font-weight: 700; font-size: 0.7rem; }
    .rank-1 { color: var(--gold);   text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    .rank-2 { color: var(--silver); }
    .rank-3 { color: var(--bronze); }
    .rank-n { color: var(--muted); }

    /* Name cell */
    .lb-name { color: var(--text); letter-spacing: 0.12em; }

    /* Score cell */
    .lb-score { color: var(--accent); font-weight: 700; text-shadow: 0 0 8px var(--accent-glow); }

    /* Highlighted row (current run) */
    .lb-table tr.current td { background: rgba(0,245,255,0.04); }
    .lb-table tr.current .lb-name { color: var(--accent); }

    /* Empty state */
    .lb-empty {
      text-align: center; padding: 2rem 0;
      font-size: 0.7rem; letter-spacing: 0.12em;
      color: var(--muted);
    }

    .lb-actions {
      display: flex; gap: 0.75rem; justify-content: flex-end;
      border-top: 1px solid rgba(0,245,255,0.1);
      padding-top: 1rem; margin-top: 0.2rem;
    }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    #speedBadge { font-size: 0.58rem; letter-spacing: 0.15em; color: var(--muted); height: 16px; }
    #speedBadge span { color: var(--accent); }

    .game-footer {
      display: flex; gap: 2rem;
      font-size: 0.58rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
    }
    .key { border: 1px solid var(--muted); padding: 1px 5px; color: var(--muted2); margin: 0 1px; }

    /* ── Mobile ──────────────────────────────────────────────────────────── */
    .touch-controls { display: none; flex-direction: column; align-items: center; gap: 5px; margin-top: 0.25rem; }
    .t-row { display: flex; gap: 5px; }
    .t-btn {
      width: 56px; height: 56px;
      background: rgba(0,245,255,0.05); border: 1px solid rgba(0,245,255,0.2);
      color: var(--accent); font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .t-btn:active { background: rgba(0,245,255,0.18); }

    @media (pointer: coarse) {
      .touch-controls { display: flex; }
      .game-footer { display: none; }
    }
    @media (max-width: 540px) {
      canvas { width: 320px !important; height: 320px !important; }
      .ov-title { font-size: 2.2rem; }
      .game-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<a href="index.html" class="back-link">← Portfolio</a>

<!-- ── Leaderboard modal ──────────────────────────────────────────────────── -->
<div id="lbModal" class="hidden">
  <div id="lbPanel">
    <div class="lb-header">
      <div>
        <p class="lb-tag">// top scores</p>
        <div class="lb-title">LEADER<span class="a">BOARD</span></div>
      </div>
    </div>
    <div id="lbContent"></div>
    <div class="lb-actions">
      <button class="btn-ghost" id="lbClose">[ CLOSE ]</button>
      <button class="btn-play" id="lbPlay">[ PLAY AGAIN ]</button>
    </div>
  </div>
</div>

<!-- ── Game ───────────────────────────────────────────────────────────────── -->
<div class="game-wrapper">
  <div class="game-header">
    <div class="game-title">SNAKE<span class="accent">_</span>EXE</div>
    <div class="scores">
      <button class="btn-lb" id="headerLbBtn">LEADERBOARD</button>
      <div class="score-box">
        <span class="score-label">Score</span>
        <span class="score-val" id="scoreDisp">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Best</span>
        <span class="score-val red" id="bestDisp">0</span>
      </div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="480" height="480"></canvas>

    <!-- Canvas overlay: start / name-entry / game-over panels -->
    <div id="overlay">
      <!-- Start panel -->
      <div id="panelStart">
        <p class="ov-tag">// initialising</p>
        <div class="ov-title">PRESS <span class="a">START</span></div>
        <p class="ov-score">&nbsp;</p>
        <button class="btn-play" id="startBtn">[ ENTER GRID ]</button>
        <button class="btn-ghost" id="startLbBtn" style="margin-top:-0.1rem;">[ LEADERBOARD ]</button>
      </div>

      <!-- Name-entry panel (shown when score qualifies) -->
      <div id="panelName" class="hidden">
        <p class="ov-tag gold">// new record</p>
        <div class="ov-title">TOP <span class="g">10</span></div>
        <p class="ov-score">Score: <span id="neScore">0</span></p>
        <div class="name-wrap">
          <span class="name-label">Enter your initials</span>
          <div class="name-row">
            <input id="nameInput" maxlength="3" placeholder="AAA" autocomplete="off" spellcheck="false">
            <button id="nameSubmit">[ OK ]</button>
          </div>
        </div>
      </div>

      <!-- Game over panel -->
      <div id="panelOver" class="hidden">
        <p class="ov-tag red">// system failure</p>
        <div class="ov-title">GAME <span class="r">OVER</span></div>
        <p class="ov-score" id="ovScore">&nbsp;</p>
        <button class="btn-play red" id="restartBtn">[ RE-ENTER GRID ]</button>
        <button class="btn-ghost" id="overLbBtn" style="margin-top:-0.1rem;">[ LEADERBOARD ]</button>
      </div>
    </div>
  </div>

  <div id="speedBadge">&nbsp;</div>

  <div class="game-footer">
    <span><span class="key">↑↓←→</span> or <span class="key">WASD</span> move</span>
    <span><span class="key">P</span> pause</span>
    <span><span class="key">R</span> restart</span>
    <span><span class="key">L</span> leaderboard</span>
  </div>

  <div class="touch-controls">
    <div class="t-row"><div class="t-btn" id="bU">▲</div></div>
    <div class="t-row">
      <div class="t-btn" id="bL">◀</div>
      <div class="t-btn" id="bD">▼</div>
      <div class="t-btn" id="bR">▶</div>
    </div>
  </div>
</div>

<script>
// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const COLS = 24, ROWS = 24, CELL = W / COLS;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const overlay     = document.getElementById('overlay');
const panelStart  = document.getElementById('panelStart');
const panelName   = document.getElementById('panelName');
const panelOver   = document.getElementById('panelOver');
const scoreDisp   = document.getElementById('scoreDisp');
const bestDisp    = document.getElementById('bestDisp');
const speedBadge  = document.getElementById('speedBadge');
const ovScore     = document.getElementById('ovScore');
const neScore     = document.getElementById('neScore');
const nameInput   = document.getElementById('nameInput');
const lbModal     = document.getElementById('lbModal');
const lbContent   = document.getElementById('lbContent');

// ── Leaderboard data ──────────────────────────────────────────────────────────
const BOARD_KEY = 'snakeBoard';
const MAX_ENTRIES = 10;

function loadBoard() {
  try { return JSON.parse(localStorage.getItem(BOARD_KEY)) || []; }
  catch { return []; }
}

function saveBoard(board) {
  localStorage.setItem(BOARD_KEY, JSON.stringify(board));
}

function qualifies(s) {
  if (s <= 0) return false;
  const board = loadBoard();
  return board.length < MAX_ENTRIES || s > board[board.length - 1].score;
}

function addEntry(name, s) {
  const board = loadBoard();
  const today = new Date().toISOString().slice(0, 10);
  board.push({ name: (name || 'AAA').toUpperCase().slice(0, 3), score: s, date: today });
  board.sort((a, b) => b.score - a.score);
  if (board.length > MAX_ENTRIES) board.length = MAX_ENTRIES;
  saveBoard(board);
  return board;
}

function renderBoard(highlightScore) {
  const board = loadBoard();
  if (board.length === 0) {
    lbContent.innerHTML = '<p class="lb-empty">// no scores yet — be the first</p>';
    return;
  }

  const rankLabels = ['01', '02', '03'];
  const rankClasses = ['rank-1', 'rank-2', 'rank-3'];

  let highlighted = false;
  const rows = board.map((e, i) => {
    const rankNum  = i + 1;
    const rankCls  = rankNum <= 3 ? rankClasses[i] : 'rank-n';
    const rankTxt  = rankNum <= 3 ? rankLabels[i] : String(rankNum).padStart(2, '0');
    const isCurrent = !highlighted && highlightScore !== undefined && e.score === highlightScore && e.name !== '';
    if (isCurrent) highlighted = true;
    return `<tr class="${isCurrent ? 'current' : ''}">
      <td><span class="rank ${rankCls}">${rankTxt}</span></td>
      <td class="lb-name">${e.name}</td>
      <td class="lb-score r">${e.score}</td>
      <td class="r" style="color:var(--muted);font-size:0.62rem;">${e.date}</td>
    </tr>`;
  }).join('');

  lbContent.innerHTML = `
    <table class="lb-table">
      <thead><tr>
        <th>Rank</th><th>Name</th><th class="r">Score</th><th class="r">Date</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function openLeaderboard(highlightScore) {
  renderBoard(highlightScore);
  lbModal.classList.remove('hidden');
}
function closeLeaderboard() {
  lbModal.classList.add('hidden');
}

// ── Best score (also kept as single int for display) ──────────────────────────
function calcBest() {
  const board = loadBoard();
  return board.length > 0 ? board[0].score : parseInt(localStorage.getItem('snakeBest') || '0');
}
let best = calcBest();
bestDisp.textContent = best;

// ── Game state ────────────────────────────────────────────────────────────────
let snake, dir, nextDir, food;
let score, tickMs, tickAcc, lastTs;
let gameState = 'idle';
let paused = false;
let rafId;

let trail = [], particles = [];
let foodAngle = 0, foodPulse = 0;
let flashAlpha = 0, deathPos = null;

const TRAIL_LEN = 28;

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  snake = [{ x:12,y:12 }, { x:11,y:12 }, { x:10,y:12 }];
  dir = { x:1,y:0 }; nextDir = { x:1,y:0 };
  score = 0; tickMs = 145; tickAcc = 0; lastTs = null; paused = false;
  trail = []; particles = []; flashAlpha = 0; deathPos = null;
  foodAngle = 0; foodPulse = 0;
  placeFood();
  scoreDisp.textContent = '0';
  speedBadge.innerHTML = '&nbsp;';
}

function placeFood() {
  const empty = [];
  for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++)
    if (!snake.some(s=>s.x===x&&s.y===y)) empty.push({x,y});
  food = empty[Math.floor(Math.random()*empty.length)];
}

function speedForScore(s) {
  if (s>=200) return 45; if (s>=120) return 55; if (s>=70) return 70;
  if (s>=40)  return 88; if (s>=20)  return 105; if (s>=8) return 120;
  return 145;
}
function levelForScore(s) {
  if (s>=200) return 6; if (s>=120) return 5; if (s>=70) return 4;
  if (s>=40)  return 3; if (s>=20)  return 2;  if (s>=8) return 1;
  return 0;
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(ts - lastTs, 100);
  lastTs = ts;

  foodAngle += dt * 0.0018;
  foodPulse += dt * 0.004;

  trail.forEach(t => t.age++);
  trail = trail.filter(t => t.age < TRAIL_LEN);

  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);

  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 0.004);

  if (!paused && gameState === 'playing') {
    tickAcc += dt;
    if (tickAcc >= tickMs) { tickAcc -= tickMs; tick(); }
  }

  draw();
}

function tick() {
  dir = { ...nextDir };
  const head = {
    x: (snake[0].x + dir.x + COLS) % COLS,
    y: (snake[0].y + dir.y + ROWS) % ROWS,
  };

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    deathPos = { ...snake[0] };
    flashAlpha = 1;
    spawnDeathParticles(snake[0]);
    gameState = 'over';
    setTimeout(showGameOver, 900);
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      bestDisp.textContent = best;
    }
    scoreDisp.textContent = score;
    tickMs = speedForScore(score);
    const lvl = levelForScore(score);
    speedBadge.innerHTML = lvl > 0 ? `// speed level <span>${lvl}</span>` : '&nbsp;';
    spawnFoodParticles(food.x, food.y);
    placeFood();
  } else {
    const tail = snake.pop();
    trail.unshift({ x: tail.x, y: tail.y, age: 0 });
  }
}

// ── Particles ─────────────────────────────────────────────────────────────────
function spawnFoodParticles(gx, gy) {
  const cx = gx*CELL+CELL/2, cy = gy*CELL+CELL/2;
  for (let i=0;i<16;i++) {
    const a = (i/16)*Math.PI*2, spd = 1.5+Math.random()*2.5;
    particles.push({ x:cx,y:cy, vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1, decay:0.035+Math.random()*0.03, size:2+Math.random()*3, color:'#ff003c' });
  }
}
function spawnDeathParticles(seg) {
  const cx = seg.x*CELL+CELL/2, cy = seg.y*CELL+CELL/2;
  for (let i=0;i<24;i++) {
    const a = Math.random()*Math.PI*2, spd = 1+Math.random()*4;
    particles.push({ x:cx,y:cy, vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1, decay:0.02+Math.random()*0.025, size:2+Math.random()*4, color:'#00f5ff' });
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle = '#00060f';
  ctx.fillRect(0,0,W,H);
  drawGrid(); drawTrail(); drawFood(); drawSnake(); drawParticles();

  if (flashAlpha > 0) {
    ctx.globalAlpha = flashAlpha * 0.45;
    ctx.fillStyle = '#ff003c';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
  if (paused && gameState==='playing') {
    ctx.fillStyle = 'rgba(0,6,15,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#00f5ff'; ctx.shadowColor='#00f5ff'; ctx.shadowBlur=16;
    ctx.font='bold 13px JetBrains Mono,monospace'; ctx.textAlign='center';
    ctx.fillText('// PAUSED — PRESS P', W/2, H/2);
    ctx.shadowBlur=0; ctx.textAlign='left';
  }
}

function drawGrid() {
  ctx.strokeStyle='rgba(0,245,255,0.028)'; ctx.lineWidth=0.5;
  for (let x=0;x<=COLS;x++) { ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,H);ctx.stroke(); }
  for (let y=0;y<=ROWS;y++) { ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(W,y*CELL);ctx.stroke(); }
  ctx.fillStyle='rgba(0,245,255,0.06)';
  for (let x=0;x<=COLS;x++) for (let y=0;y<=ROWS;y++) ctx.fillRect(x*CELL-0.75,y*CELL-0.75,1.5,1.5);
}

function drawTrail() {
  trail.forEach(t => {
    const p = t.age/TRAIL_LEN, inset = 2+p*4, sz = CELL-inset*2;
    if (sz<=0) return;
    ctx.globalAlpha=(1-p)*0.55; ctx.shadowColor='#00f5ff'; ctx.shadowBlur=10*(1-p);
    ctx.fillStyle='#00c8d4';
    ctx.fillRect(t.x*CELL+inset, t.y*CELL+inset, sz, sz);
  });
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

function drawSnake() {
  if (!snake) return;
  const len = snake.length;
  for (let i=len-1;i>=0;i--) {
    const seg=snake[i], t=i/Math.max(len-1,1), isHead=i===0;
    if (isHead) {
      ctx.shadowColor='#00f5ff'; ctx.shadowBlur=22; ctx.fillStyle='#00f5ff';
      ctx.fillRect(seg.x*CELL+1,seg.y*CELL+1,CELL-2,CELL-2);
      ctx.shadowBlur=6; ctx.fillStyle='#aafffe';
      ctx.fillRect(seg.x*CELL+5,seg.y*CELL+5,CELL-10,CELL-10);
    } else {
      const bright=1-t*0.55;
      ctx.shadowColor='#00f5ff'; ctx.shadowBlur=10*(1-t*0.7);
      ctx.fillStyle=`rgba(0,${Math.round(180*bright+40)},${Math.round(200*bright+50)},${0.9-t*0.4})`;
      ctx.fillRect(seg.x*CELL+2,seg.y*CELL+2,CELL-4,CELL-4);
    }
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  if (snake.length>0) {
    const h=snake[0]; ctx.fillStyle='#001820'; const e=4;
    if (dir.x===1)  { ctx.fillRect(h.x*CELL+CELL-6,h.y*CELL+e,3,3); ctx.fillRect(h.x*CELL+CELL-6,h.y*CELL+CELL-e-3,3,3); }
    if (dir.x===-1) { ctx.fillRect(h.x*CELL+3,h.y*CELL+e,3,3);      ctx.fillRect(h.x*CELL+3,h.y*CELL+CELL-e-3,3,3); }
    if (dir.y===-1) { ctx.fillRect(h.x*CELL+e,h.y*CELL+3,3,3);      ctx.fillRect(h.x*CELL+CELL-e-3,h.y*CELL+3,3,3); }
    if (dir.y===1)  { ctx.fillRect(h.x*CELL+e,h.y*CELL+CELL-6,3,3); ctx.fillRect(h.x*CELL+CELL-e-3,h.y*CELL+CELL-6,3,3); }
  }
}

function drawFood() {
  if (!food) return;
  const cx=food.x*CELL+CELL/2, cy=food.y*CELL+CELL/2;
  const pulse=Math.sin(foodPulse*2)*0.3+0.7;
  const size=(CELL/2-2)*(0.85+pulse*0.15);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,CELL*2.2);
  g.addColorStop(0,`rgba(255,0,60,${0.18*pulse})`); g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.fillRect(cx-CELL*2.2,cy-CELL*2.2,CELL*4.4,CELL*4.4);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(foodAngle);
  ctx.shadowColor='#ff003c'; ctx.shadowBlur=18*pulse;
  ctx.strokeStyle='#ff003c'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-size);ctx.lineTo(size,0);ctx.lineTo(0,size);ctx.lineTo(-size,0);ctx.closePath(); ctx.stroke();
  ctx.globalAlpha=0.35*pulse; ctx.fillStyle='#ff003c'; ctx.fill(); ctx.globalAlpha=1;
  ctx.shadowBlur=8; ctx.strokeStyle='rgba(255,80,120,0.6)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(-size*0.6,0);ctx.lineTo(size*0.6,0);ctx.moveTo(0,-size*0.6);ctx.lineTo(0,size*0.6); ctx.stroke();
  ctx.restore(); ctx.shadowBlur=0; ctx.globalAlpha=1;
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha=p.life; ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.fillStyle=p.color; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

// ── Panel switching ───────────────────────────────────────────────────────────
function showPanel(name) {
  [panelStart, panelName, panelOver].forEach(p => p.classList.add('hidden'));
  overlay.classList.remove('hidden');
  document.getElementById('panel' + name).classList.remove('hidden');
}

function hideOverlay() { overlay.classList.add('hidden'); }

// ── Game over flow ────────────────────────────────────────────────────────────
function showGameOver() {
  if (qualifies(score)) {
    // Show name entry
    neScore.textContent = score;
    nameInput.value = '';
    showPanel('Name');
    setTimeout(() => nameInput.focus(), 50);
  } else {
    ovScore.innerHTML = `Score: <span>${score}</span> &nbsp;|&nbsp; Best: <span>${best}</span>`;
    showPanel('Over');
  }
}

function submitName() {
  const name = (nameInput.value.trim() || 'AAA').toUpperCase().slice(0, 3);
  addEntry(name, score);
  best = calcBest();
  bestDisp.textContent = best;
  localStorage.setItem('snakeBest', best);
  closeLeaderboard();
  openLeaderboard(score);
}

// ── Start / restart ───────────────────────────────────────────────────────────
function startGame() {
  closeLeaderboard();
  hideOverlay();
  cancelAnimationFrame(rafId);
  gameState = 'playing';
  init();
  rafId = requestAnimationFrame(loop);
}

// ── Button wiring ─────────────────────────────────────────────────────────────
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('nameSubmit').addEventListener('click', submitName);
nameInput.addEventListener('keydown', e => { if (e.key==='Enter') submitName(); });

document.getElementById('headerLbBtn').addEventListener('click', () => openLeaderboard());
document.getElementById('startLbBtn').addEventListener('click',  () => openLeaderboard());
document.getElementById('overLbBtn').addEventListener('click',   () => openLeaderboard(score));

document.getElementById('lbClose').addEventListener('click', closeLeaderboard);
document.getElementById('lbPlay').addEventListener('click',  startGame);

// Close modal on backdrop click
lbModal.addEventListener('click', e => { if (e.target===lbModal) closeLeaderboard(); });

// ── Keyboard ──────────────────────────────────────────────────────────────────
const DIRS = {
  ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},
  ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},
  ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},
  ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0},
};

document.addEventListener('keydown', e => {
  // Don't hijack typing in the name input
  if (document.activeElement === nameInput) return;

  if (e.key==='p'||e.key==='P') { if (gameState==='playing') paused=!paused; return; }
  if (e.key==='r'||e.key==='R') { if (gameState!=='idle') startGame(); return; }
  if (e.key==='l'||e.key==='L') { lbModal.classList.contains('hidden') ? openLeaderboard() : closeLeaderboard(); return; }
  if (e.key===' ' && gameState!=='playing') { startGame(); return; }
  const d = DIRS[e.key];
  if (!d) return;
  e.preventDefault();
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
});

// ── Touch controls ────────────────────────────────────────────────────────────
function td(d) { if (gameState==='playing'&&(d.x!==(-dir.x)||d.y!==(-dir.y))) nextDir=d; }
document.getElementById('bU').addEventListener('click', ()=>td({x:0,y:-1}));
document.getElementById('bD').addEventListener('click', ()=>td({x:0,y:1}));
document.getElementById('bL').addEventListener('click', ()=>td({x:-1,y:0}));
document.getElementById('bR').addEventListener('click', ()=>td({x:1,y:0}));

// ── Boot ──────────────────────────────────────────────────────────────────────
init();
draw();
showPanel('Start');
</script>
</body>
